# Dependencies for the Pulse template: PostgreSQL (with the schema auto-applied) + Redis.
# Ports match the backend's config defaults (pg_dsn → 127.0.0.1:5433, redis → 127.0.0.1:6379),
# so `pulse` connects with no extra flags. Brought up for you by `../../../tools/katana dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: katana
      POSTGRES_DB: katana
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katana -d katana"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
