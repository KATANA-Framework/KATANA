openapi: 3.0.0
info:
  title: Task Management API
  version: 1.0.0
  description: |
    Comprehensive task management service demonstrating KATANA framework capabilities:
    - CRUD operations
    - Complex validation rules
    - Nested objects and arrays
    - Query parameters
    - Edge case handling

paths:
  /tasks:
    get:
      operationId: listTasks
      summary: List all tasks with optional filtering
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, in_progress, completed, cancelled]
        - name: priority
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'

    post:
      operationId: createTask
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /tasks/{id}:
    get:
      operationId: getTask
      summary: Get a specific task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    put:
      operationId: updateTask
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      operationId: deleteTask
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Task deleted
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /tasks/batch:
    post:
      operationId: batchCreateTasks
      summary: Create multiple tasks in a single request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
      responses:
        '200':
          description: Batch operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreateResponse'

  /tasks/search:
    post:
      operationId: searchTasks
      summary: Complex task search with multiple criteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'

  /health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - status
        - priority
        - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        priority:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
          uniqueItems: true
        assignee:
          $ref: '#/components/schemas/User'
        due_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true

    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 100

    CreateTaskRequest:
      type: object
      required:
        - title
        - priority
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        priority:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
          uniqueItems: true
        assignee_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        due_date:
          type: string
          format: date-time
          nullable: true

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        priority:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 20
          uniqueItems: true
        assignee_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        due_date:
          type: string
          format: date-time
          nullable: true

    BatchCreateRequest:
      type: object
      required:
        - tasks
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/CreateTaskRequest'
          minItems: 1
          maxItems: 100

    BatchCreateResponse:
      type: object
      required:
        - created
        - failed
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        failed:
          type: array
          items:
            type: object
            required:
              - index
              - error
            properties:
              index:
                type: integer
              error:
                type: string

    SearchRequest:
      type: object
      properties:
        title_contains:
          type: string
          minLength: 1
          maxLength: 100
        statuses:
          type: array
          items:
            type: string
            enum: [pending, in_progress, completed, cancelled]
          minItems: 1
          maxItems: 4
          uniqueItems: true
        min_priority:
          type: integer
          minimum: 1
          maximum: 5
        max_priority:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
          maxItems: 10
        created_after:
          type: string
          format: date-time
        created_before:
          type: string
          format: date-time
        has_assignee:
          type: boolean

    TaskList:
      type: object
      required:
        - tasks
        - total
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
          minimum: 0
        has_more:
          type: boolean

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          minimum: 0
        total_requests:
          type: integer
          minimum: 0

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
