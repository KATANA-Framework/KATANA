[package]
name = "katana_comparison_axum"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
deadpool-postgres = "0.14"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
serde = { version = "1", features = ["derive"] }
tokio-postgres = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde"] }

# Benchmark fairness: match KATANA's -O3 -march=native + LTO so the comparison is
# apples-to-apples on build optimization (added during fairness audit).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
