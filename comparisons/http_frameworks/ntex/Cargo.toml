[package]
name = "katana_comparison_ntex"
version = "0.1.0"
edition = "2021"

[dependencies]
deadpool-postgres = "0.14"
ntex = { version = "2.17", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
tokio-postgres = "0.7"
uuid = { version = "1", features = ["serde"] }

# Benchmark fairness: match KATANA's -O3 -march=native + LTO so the comparison is
# apples-to-apples on build optimization (added during fairness audit).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
