services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    command:
      - postgres
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - checkpoint_completion_target=0.9
    environment:
      POSTGRES_DB: katana_stage4
      POSTGRES_USER: katana
      POSTGRES_PASSWORD: katana
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U katana -d katana_stage4"]
      interval: 2s
      timeout: 2s
      retries: 30
