name: Performance Regression Detection

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'katana/core/**'
      - 'tools/katana_gen/**'
      - 'benchmark/**'
      - 'benchmarks/**'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Regression threshold percentage'
        required: false
        default: '3'
      stage:
        description: 'Benchmark stage (1, 2, or all)'
        required: false
        default: 'all'

env:
  REGRESSION_THRESHOLD: ${{ github.event.inputs.threshold || '3' }}

jobs:
  # ============================================================
  # Stage 1: Core Runtime — runs when katana/core/ changes
  # ============================================================
  benchmark-stage1:
    name: "Stage 1: Core Runtime Benchmarks"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.changed_files, 'katana/core/')

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang-18 clang++-18 clang-tools-18 \
          liburing-dev libc++-18-dev libc++abi-18-dev ccache python3

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.cache/ccache
        key: ${{ runner.os }}-bench-s1-${{ hashFiles('**/CMakeLists.txt') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-bench-s1-${{ hashFiles('**/CMakeLists.txt') }}-
          ${{ runner.os }}-bench-s1-

    - name: Configure and Build Stage 1 Benchmarks
      run: |
        SCAN_DEPS_FLAGS="-DCMAKE_C_COMPILER_CLANG_SCAN_DEPS=/usr/bin/clang-scan-deps-18 -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=/usr/bin/clang-scan-deps-18"
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang-18 \
          -DCMAKE_CXX_COMPILER=clang++-18 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DENABLE_BENCHMARKS=ON \
          ${SCAN_DEPS_FLAGS}
        cmake --build build --target bench_stage1 -j$(nproc)

    - name: Run Stage 1 Benchmarks
      run: |
        python3 tools/katana_bench.py --stage 1 --format json > benchmark_results_s1.json
        python3 tools/katana_bench.py --stage 1 --format console

    - name: Compare Against Stage 1 Baseline
      id: compare_s1
      run: |
        if [ -f "benchmarks/baseline_stage1.json" ]; then
          python3 tools/katana_bench.py --stage 1 --format json \
            --compare benchmarks/baseline_stage1.json > /dev/null 2>&1 || {
            echo "regression_detected=true" >> $GITHUB_OUTPUT
            echo "::warning::Stage 1 performance regression detected!"
            exit 0
          }
          echo "regression_detected=false" >> $GITHUB_OUTPUT
          echo "::notice::Stage 1: No performance regression detected."
        else
          echo "No Stage 1 baseline found, skipping comparison"
          echo "regression_detected=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload Stage 1 Results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-stage1
        path: benchmark_results_s1.json
        retention-days: 30

  # ============================================================
  # Stage 2: Codegen Quality — runs when codegen or core changes
  # ============================================================
  benchmark-stage2:
    name: "Stage 2: Codegen Quality Benchmarks"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.changed_files, 'tools/katana_gen/') ||
      contains(github.event.pull_request.changed_files, 'katana/core/')

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build clang-18 clang++-18 clang-tools-18 \
          liburing-dev libc++-18-dev libc++abi-18-dev ccache python3

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          build
          ~/.cache/ccache
        key: ${{ runner.os }}-bench-s2-${{ hashFiles('**/CMakeLists.txt') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-bench-s2-${{ hashFiles('**/CMakeLists.txt') }}-
          ${{ runner.os }}-bench-s2-

    - name: Configure and Build Stage 2 Benchmarks
      run: |
        SCAN_DEPS_FLAGS="-DCMAKE_C_COMPILER_CLANG_SCAN_DEPS=/usr/bin/clang-scan-deps-18 -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=/usr/bin/clang-scan-deps-18"
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang-18 \
          -DCMAKE_CXX_COMPILER=clang++-18 \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DENABLE_BENCHMARKS=ON \
          ${SCAN_DEPS_FLAGS}
        cmake --build build --target bench_stage2 -j$(nproc)

    - name: Run Stage 2 Benchmarks
      run: |
        python3 tools/katana_bench.py --stage 2 --format json > benchmark_results_s2.json
        python3 tools/katana_bench.py --stage 2 --format console

    - name: Compare Against Stage 2 Baseline
      id: compare_s2
      run: |
        if [ -f "benchmarks/baseline_stage2.json" ]; then
          python3 tools/katana_bench.py --stage 2 --format json \
            --compare benchmarks/baseline_stage2.json > /dev/null 2>&1 || {
            echo "regression_detected=true" >> $GITHUB_OUTPUT
            echo "::warning::Stage 2 performance regression detected!"
            exit 0
          }
          echo "regression_detected=false" >> $GITHUB_OUTPUT
          echo "::notice::Stage 2: No performance regression detected."
        else
          echo "No Stage 2 baseline found, skipping comparison"
          echo "regression_detected=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload Stage 2 Results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-stage2
        path: benchmark_results_s2.json
        retention-days: 30

  # ============================================================
  # Summary — posts PR comment if regressions detected
  # ============================================================
  benchmark-summary:
    name: Benchmark Summary
    runs-on: ubuntu-24.04
    needs: [benchmark-stage1, benchmark-stage2]
    if: always() && github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Download Stage 1 Results
      uses: actions/download-artifact@v4
      with:
        name: benchmark-results-stage1
        path: results/
      continue-on-error: true

    - name: Download Stage 2 Results
      uses: actions/download-artifact@v4
      with:
        name: benchmark-results-stage2
        path: results/
      continue-on-error: true

    - name: Post Comment on PR
      if: >
        needs.benchmark-stage1.outputs.regression_detected == 'true' ||
        needs.benchmark-stage2.outputs.regression_detected == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let body = '## ⚠️ Performance Regression Detected\n\n';
          body += `Threshold: ${process.env.REGRESSION_THRESHOLD}%\n\n`;

          for (const stage of ['s1', 's2']) {
            const file = `results/benchmark_results_${stage}.json`;
            if (fs.existsSync(file)) {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              const stageName = stage === 's1' ? 'Stage 1: Core Runtime' : 'Stage 2: Codegen Quality';
              body += `### ${stageName}\n\n`;
              body += '| Benchmark | Binary | Latency (ns/op) |\n';
              body += '|-----------|--------|----------------|\n';
              for (const [binary, metrics] of Object.entries(data.benchmarks || {})) {
                for (const [name, m] of Object.entries(metrics)) {
                  body += `| ${name} | ${binary} | ${m.ns_per_op.toFixed(1)} |\n`;
                }
              }
              body += '\n';
            }
          }

          body += '\n---\n*This check runs automatically on changes to core or codegen code.*';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
